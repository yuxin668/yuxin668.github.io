<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EOMSG 云短信工具</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937}
.wrap{max-width:1100px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:24px;margin:0}.muted{color:#6b7280;font-size:13px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #00000008}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
label{display:block;font-size:13px;color:#4b5563;margin-bottom:6px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff}textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:8px;padding:10px 15px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px;margin-right:8px;margin-top:10px}button.secondary{background:#6b7280}button.warn{background:#d97706}button.danger{background:#dc2626}button:disabled{opacity:.5;cursor:not-allowed}
.value{font-size:24px;font-weight:700;margin-top:5px}.status{padding:10px 12px;border-radius:8px;background:#f3f4f6;font-size:13px;white-space:pre-wrap}
pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;padding:14px;border-radius:8px;min-height:90px;margin:10px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:4px}.actions button{margin-top:0}.small{font-size:12px}
@media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}.wrap{padding:12px}.top{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>EOMSG 云短信工具</h1><div class="muted">单文件静态版 · 仅供个人测试使用</div></div>
  </div>

  <div class="card">
    <h3>API 设置</h3>
    <div class="grid">
      <div><label>API 地址</label><input id="api" value="https://api.eomsg.com/zc/data.php"></div>
      <div><label>Token</label><input id="token" type="text" placeholder="填写你的 EOMSG Token"></div>
    </div>
    <button onclick="saveSettings()">保存设置</button>
    <button class="secondary" onclick="clearSettings()">清除本机保存</button>
    <div id="settingsStatus" class="status" style="margin-top:10px">Token 只保存在当前浏览器的 localStorage 中，并会被用于直接请求 API。</div>
  </div>

  <div class="grid3">
    <div class="card"><div class="muted">账户余额</div><div id="balance" class="value">—</div><button onclick="getBalance()">查询余额</button></div>
    <div class="card"><div class="muted">当前号码</div><div id="currentPhone" class="value" style="font-size:19px">—</div></div>
    <div class="card"><div class="muted">最近状态</div><div id="state" class="value" style="font-size:16px">等待操作</div></div>
  </div>

  <div class="card">
    <h3>获取号码</h3>
    <div class="grid3">
      <div><label>项目关键词（可选）</label><input id="keyWord" placeholder="例如项目名称/关键词"></div>
      <div><label>指定手机号（可选）</label><input id="phoneFilter" placeholder="130xxxxxxxx"></div>
      <div>
        <label>归属地（可选）</label>
        <select id="province">
          <option value="" selected>全部归属地</option>
          <option value="北京">北京</option><option value="天津">天津</option><option value="上海">上海</option><option value="重庆">重庆</option>
          <option value="河北">河北</option><option value="山西">山西</option><option value="辽宁">辽宁</option><option value="吉林">吉林</option><option value="黑龙江">黑龙江</option>
          <option value="江苏">江苏</option><option value="浙江">浙江</option><option value="安徽">安徽</option><option value="福建">福建</option><option value="江西">江西</option>
          <option value="山东">山东</option><option value="河南">河南</option><option value="湖北">湖北</option><option value="湖南">湖南</option><option value="广东">广东</option>
          <option value="海南">海南</option><option value="四川">四川</option><option value="贵州">贵州</option><option value="云南">云南</option><option value="陕西">陕西</option>
          <option value="甘肃">甘肃</option><option value="青海">青海</option><option value="内蒙古">内蒙古</option><option value="广西">广西</option><option value="西藏">西藏</option>
          <option value="宁夏">宁夏</option><option value="新疆">新疆</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px"><label>卡类型</label>
      <select id="cardType"><option>全部</option><option>实卡</option><option>虚卡</option></select>
    </div>
    <div class="actions">
      <button onclick="getPhone()">获取号码</button>
      <button class="secondary" onclick="releasePhone()">释放当前号码</button>
      <button class="danger" onclick="blockPhone()">拉黑当前号码</button>
    </div>
  </div>

  <div class="card">
    <h3>查询短信</h3>
    <div class="grid">
      <div><label>手机号</label><input id="smsPhone" placeholder="获取号码后自动填入"></div>
      <div><label>项目关键词</label><input id="smsKeyWord" placeholder="与 getPhone 使用的项目关键词一致"></div>
    </div>
    <div class="actions">
      <button onclick="getMessage()">查询短信</button>
      <button class="warn" id="pollBtn" onclick="togglePolling()">开始自动轮询</button>
    </div>
    <div class="small muted" style="margin-top:8px">轮询默认每 5 秒查询一次。收到短信后会自动停止。</div>
    <pre id="messageResult">暂无短信内容</pre>
  </div>

  <div class="card">
    <h3>发送短信</h3>
    <div class="grid">
      <div><label>发送手机号</label><input id="sendPhone" placeholder="162xxxxxxxx"></div>
      <div><label>目标号码</label><input id="toPhone" placeholder="1069xxxxxxxx"></div>
    </div>
    <div style="margin-top:12px"><label>项目 ID</label><input id="projId" placeholder="按接口要求填写"></div>
    <div style="margin-top:12px"><label>短信内容</label><textarea id="content" placeholder="填写短信内容"></textarea></div>
    <button onclick="sendMessage()">发送短信</button>
  </div>

  <div class="card">
    <h3>最近 24 小时记录</h3>
    <button onclick="queryUsed()">查询已使用记录</button>
    <div class="small muted" style="margin-top:8px">注意：queryUsed 接口官方限制为不超过每分钟一次。</div>
    <pre id="historyResult">暂无记录</pre>
  </div>

  <div class="card">
    <h3>接口返回</h3>
    <pre id="raw">等待操作…</pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let timer = null;
let lastHistoryAt = 0;

function loadSettings(){
  $("api").value = localStorage.getItem("eomsg_api") || "https://api.eomsg.com/zc/data.php";
  $("token").value = localStorage.getItem("eomsg_token") || "";
}
function saveSettings(){
  localStorage.setItem("eomsg_api",$("api").value.trim());
  localStorage.setItem("eomsg_token",$("token").value.trim());
  $("settingsStatus").textContent="已保存到本机浏览器。";
}
function clearSettings(){
  localStorage.removeItem("eomsg_api"); localStorage.removeItem("eomsg_token");
  $("token").value=""; $("settingsStatus").textContent="已清除本机保存的 Token。";
}
function cfg(){
  const api=$("api").value.trim(), token=$("token").value.trim();
  if(!api || !token) throw new Error("请先填写 API 地址和 Token");
  return {api,token};
}
function showRaw(x){ $("raw").textContent = typeof x==="string" ? x : JSON.stringify(x,null,2); }
function setState(x){ $("state").textContent=x; }

async function callApi(code, params={}){
  const {api,token}=cfg();
  const qs=new URLSearchParams({code,token,...params});
  const url=api+"?"+qs.toString();
  const r=await fetch(url,{method:"GET"});
  const text=await r.text();
  showRaw(text);
  if(text.startsWith("ERROR:")) throw new Error(text);
  return text;
}
async function getBalance(){
  try{
    setState("查询中…"); const t=await callApi("leftAmount");
    $("balance").textContent=t; setState("余额查询成功");
  }catch(e){setState("失败"); alert(e.message)}
}
async function getPhone(){
  try{
    setState("获取中…");
    const params={keyWord:$("keyWord").value.trim(),phone:$("phoneFilter").value.trim(),province:$("province").value.trim(),cardType:$("cardType").value};
    Object.keys(params).forEach(k=>{if(!params[k])delete params[k]});
    const t=await callApi("getPhone",params);
    $("currentPhone").textContent=t;
    $("smsPhone").value=t;
    $("sendPhone").value=t;
    $("smsKeyWord").value=$("keyWord").value.trim();
    setState("获取号码成功");
  }catch(e){setState("失败");alert(e.message)}
}
function currentPhone(){
  return $("smsPhone").value.trim() || $("currentPhone").textContent.trim();
}
async function releasePhone(){
  const phone=currentPhone(); if(!phone||phone==="—")return alert("没有当前号码");
  try{setState("释放中…"); const t=await callApi("release",{phone}); setState("释放完成"); alert(t)}
  catch(e){setState("失败");alert(e.message)}
}
async function blockPhone(){
  const phone=currentPhone(); if(!phone||phone==="—")return alert("没有当前号码");
  if(!confirm("确定要拉黑当前号码吗？"))return;
  try{setState("拉黑中…"); const t=await callApi("block",{phone}); setState("拉黑完成"); alert(t)}
  catch(e){setState("失败");alert(e.message)}
}
async function getMessage(silent=false){
  try{
    const phone=currentPhone(), keyWord=$("smsKeyWord").value.trim();
    if(!phone||phone==="—")throw new Error("请先填写手机号");
    if(!keyWord)throw new Error("请填写项目关键词");
    const t=await callApi("getMsg",{phone,keyWord});
    $("messageResult").textContent=t;
    if(!t.includes("[尚未收到]")){
      setState("已收到短信"); stopPolling(); return true;
    }
    if(!silent)setState("尚未收到短信");
    return false;
  }catch(e){if(!silent){setState("失败");alert(e.message)} return false}
}
function togglePolling(){
  if(timer){stopPolling();return}
  const sec=Number(prompt("请输入轮询间隔秒数（建议 5 秒以上）","5"));
  if(!sec||sec<1)return;
  $("pollBtn").textContent="停止自动轮询";
  setState("自动轮询中…");
  getMessage(true);
  timer=setInterval(()=>getMessage(true),sec*1000);
}
function stopPolling(){
  if(timer){clearInterval(timer);timer=null}
  $("pollBtn").textContent="开始自动轮询";
}
async function sendMessage(){
  const phone=$("sendPhone").value.trim(),toPhone=$("toPhone").value.trim(),projId=$("projId").value.trim(),content=$("content").value;
  if(!phone||!toPhone||!content)return alert("请填写发送手机号、目标号码和短信内容");
  try{setState("发送中…");const t=await callApi("send",{phone,toPhone,projId,content});setState("发送完成");alert(t)}
  catch(e){setState("失败");alert(e.message)}
}
async function queryUsed(){
  if(Date.now()-lastHistoryAt<60000)return alert("queryUsed 官方限制为每分钟最多一次，请稍后再试。");
  try{
    setState("查询记录中…"); const t=await callApi("queryUsed");
    $("historyResult").textContent=t; lastHistoryAt=Date.now(); setState("记录查询成功");
  }catch(e){setState("失败");alert(e.message)}
}
loadSettings();
</script>
</body>
</html>
